# CUV_ObjectCheck fine-tune (notebooks/17_cuv_wall_sam3_finetune.ipynb).
# Adds the 2026-09-22 collection to the dataset_v2 model: walls labeled by
# YOLOE text prompt, near-range gaps by SAM3, new objects mapped into the
# existing 8 classes, old data replayed so the old camera is not forgotten.
stage: train
tag: cuv_v1

# relative to the artifacts dir (Drive on Colab); built locally by
# scripts/export_cuv_bundle.py and uploaded by hand
bundle: cuv_objectcheck/cuv_bundle_v1.zip
base_dataset: datasets/20260718_dataset_v2
base_model: models/20260719_train_yolo_v1/train/weights/best.pt
# notebook 19 click-and-track labels for the 48 training/val traces (never the
# 24 test traces); used by experiments with `labels: clicktrack`
clicktrack_labels: gold/clicktrack_v1/clicktrack_train.csv

# tracelist object -> dataset_v2 training class (null = left out of training)
class_map:
  isopole: pole
  dummychild: dummychild
  dummyadult: dummychild
  car: high_other
  wall: high_other
  box30: high_other
  box40: high_other
  curbhigh: curbstone
  woodencurb10: curbstone
  metalbar: null          # invisible below ~5 m; far labels unverified

class_ids:                # dataset_v2, unchanged
  curbstone: 0
  speedbump: 1
  woodenboard: 2
  pole: 3
  dummychild: 4
  bicyclestand: 5
  low_other: 6
  high_other: 7

split:                    # per (object, side): test = one trace per speed
  n_test_per_group: 2
  n_val_per_group: 1
  seed: 0
frame_stride: 3           # consecutive frames are near-duplicates at 30 fps

yoloe:
  weights: yoloe-26s-seg.pt
  prompt: wall
  conf: 0.15
  imgsz: 640
  max_gap: 20

sam3:
  min_gap: 5              # shorter gaps are left to interpolation
  max_tail: 90            # frames past the last label (3 s, the near range)
  backfill_classes: [wall]
  max_lead: 60
  min_area_px: 150
  end_iou: 0.3            # interior gap: propagated mask must still match
  max_segment: 300        # longer gaps are skipped (tracker memory, drift)
  score_threshold: 0.3

train_defaults:           # every experiment starts from these
  imgsz: 640              # new camera's native width; old 960-wide frames
  batch: 16               #   are downscaled, matching the scale finding
  seed: 0
  optimizer: auto         # NOTE: with auto, Ultralytics ignores lr0 and
  lr0: 0.01               #   picks its own; set an optimizer to control lr0
  warmup_epochs: 3
  freeze: null
  augment:
    mosaic: 1.0
    copy_paste: 0.3
    fliplr: 0.5
    scale: 0.5

# RUNS in notebook 17 picks from these; each gets models/train_cuv_v1_<name>
# and a dataset named by its replay share. Never edit an experiment that has
# already run - add a new name instead (the notebook refuses a changed config).
experiments:
  yolo11s_ft_v2:          # gentle fine-tune of the paper model: the first
    init: base_model      #   run (auto optimizer) ramped lr to 0.028 and its
    epochs: 10            #   best.pt was epoch 1
    replay_frac: 0.35
    optimizer: SGD
    lr0: 0.001
    warmup_epochs: 0
  yolo11s_ft_ct:          # same recipe as yolo11s_ft_v2, but CUV labels from
    init: base_model      #   notebook 19 (human-checked tracks; curbs boxed on
    epochs: 10            #   the curb) - isolates the effect of label quality
    replay_frac: 0.35
    optimizer: SGD
    lr0: 0.001
    warmup_epochs: 0
    labels: clicktrack
  yolo26s_full:           # fair YOLO26s test: COCO start, all of dataset_v2
    init: yolo26s.pt
    epochs: 60
    replay_frac: 1.0

# First runs (2026-10-09), kept for comparison only - not re-runnable:
# models/train_cuv_v1_yolo11s_ft (auto optimizer, 30 epochs, replay 0.35,
# best.pt = epoch 1) and models/train_cuv_v1_yolo26s (60 epochs; trained on
# the replay-0.35 dataset although its config says 1.0).
legacy_runs: [train_cuv_v1_yolo11s_ft, train_cuv_v1_yolo26s]

eval:
  imgsz: [480, 640]       # spec eval sizes; mAP is measured at train_defaults.imgsz
  conf: 0.15
  min_score: 0.05
  spec_window_m: 0.25
