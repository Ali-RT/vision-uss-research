# HELD-OUT LOW TYPE #2 (CVPR method): second unseen low obstacle after
# woodenboard, so the defer-on-"other" cascade result does not rest on one
# type. 295 speedbump sequences, all forced to test.
# notebooks/05: CONFIG_NAME = "dataset_v2_holdout_speedbump"
stage: dataset
tag: v2holdspeedbump

sources:
  - name: sam3_text
    gold: false
  - name: clicks
    gold: true

# objects mapped into buckets (everything not listed keeps its own class)
class_groups:
  hose: low_other
  step: low_other
  cone: high_other
  bollard: high_other
  car: high_other
  tree: high_other
  bush: high_other
  stonelarge: high_other
  stonemiddle: high_other
  cubestandard: high_other
  ubarrier: high_other
  fence: high_other

class_ids:
  curbstone: 0
  speedbump: 1
  woodenboard: 2
  pole: 3
  dummychild: 4
  bicyclestand: 5
  low_other: 6
  high_other: 7

# open-set experiment: these objects are excluded from train/val entirely
# (all their sequences forced to test), measuring generalization of the
# bucket classes to NEVER-SEEN object types. [] disables.
holdout_objects: [speedbump]
# speedbump is a NAMED class (not a bucket member): holding it out leaves
# its class id with no training data, which is the point - waive the check.
allow_empty_classes: [speedbump]

split:
  gold_test_frac: 0.20
  auto_test_frac: 0.10
  val_frac: 0.15
seed: 0
